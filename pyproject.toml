[project]
name = "pi-time-lapse"
version = "0.1.0"
description = "Durable Raspberry Pi timelapse capture and power-aware image transfer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
homeassistant = ["paho-mqtt==2.1.0"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["timelapse"]
